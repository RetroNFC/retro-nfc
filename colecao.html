<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Cartuchos - Retrô NFC</title>
    <link rel="preload" href="games.json" as="fetch" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        @font-face {
            font-family: 'Pretendo';
            src: url('assets/fonts/Pretendo.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

@font-face {
            font-family: 'Jersey Retro';
            src: url('assets/fonts/Jersey10.ttf') format('truetype');
            font-weight: 400 700;
            font-style: normal;
            font-display: swap;
            size-adjust: 200%;
        }

                :root {
            --bg:        #0B0714;
            --card:      #151026;
            --card-2:    #0F0A1C;
            --linha:     #2a2142;
            --texto:     #ece8f7;
            --texto-dim: #9a90b5;
            --azul:      #00CFFF;
            --roxo:      #A020F0;
            --laranja:   #FF8C00;
            --amarelo:   #FFD700;
            --marca:     linear-gradient(90deg, #00CFFF, #A020F0, #FF8C00, #FFD700);
        }

        body {
            background:
                radial-gradient(900px 500px at 50% -10%, rgba(160,32,240,.22), transparent 70%),
                radial-gradient(700px 400px at 90% 110%, rgba(0,207,255,.12), transparent 70%),
                var(--bg);
            color: var(--texto);
            font-family: 'Jersey Retro', 'Press Start 2P', monospace;
            text-align: center;
            padding: 84px 18px 48px;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,.02) 0px,
                rgba(255,255,255,.02) 1px,
                transparent 1px,
                transparent 3px
            );
        }

        h1 {
            position: relative;
            z-index: 1;
            font-family: 'Pretendo', sans-serif;
            font-size: 26px;
            margin: 0 0 14px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 1px;
        }

        h1 .titulo {
            background: var(--marca);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 14px rgba(160,32,240,.5));
        }

        .icone-trofeu { font-size: 26px; position: relative; top: -3px; }

        p.sub {
            position: relative;
            z-index: 1;
            font-size: 10px;
            color: var(--texto-dim);
            margin: 0 auto 22px;
            line-height: 1.9;
            max-width: 420px;
        }

        /* --- Progresso --- */
        .progresso {
            position: relative;
            z-index: 1;
            max-width: 420px;
            margin: 0 auto 22px;
        }

        .progresso-texto {
            font-size: 11px;
            color: var(--texto);
            margin-bottom: 10px;
            line-height: 1.8;
        }

        .progresso-texto b { color: var(--amarelo); font-weight: normal; }

        .barra {
            height: 12px;
            border-radius: 99px;
            background: #1b1430;
            border: 1px solid var(--linha);
            overflow: hidden;
        }

        .barra-fill {
            height: 100%;
            width: 0;
            border-radius: 99px;
            background-image: linear-gradient(90deg, #00CFFF, #A020F0, #FF8C00, #FFD700);
            background-repeat: no-repeat;
            transition: width .8s cubic-bezier(.2,.8,.3,1);
        }

        /* --- Ferramentas: busca, filtros, som --- */
        .ferramentas {
            position: relative;
            z-index: 1;
            max-width: 620px;
            margin: 0 auto 26px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .busca {
            width: 100%;
            padding: 13px 16px;
            font-family: 'Jersey Retro', 'Press Start 2P', monospace;
            font-size: 11px;
            color: var(--texto);
            background: rgba(255,255,255,.04);
            border: 1px solid var(--linha);
            border-radius: 50px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .busca::placeholder { color: #6f6590; }

        .busca:focus {
            border-color: var(--azul);
            box-shadow: 0 0 16px rgba(0,207,255,.25);
        }

        .linha-filtros {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }

        .chip {
            font-family: 'Jersey Retro', 'Press Start 2P', monospace;
            font-size: 10px;
            letter-spacing: .5px;
            color: #cfc7e6;
            background: rgba(255,255,255,.04);
            border: 1px solid var(--linha);
            border-radius: 50px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background .2s, border-color .2s, color .2s, transform .12s;
        }

        .chip:hover { border-color: var(--roxo); color: #fff; }
        .chip:active { transform: scale(.95); }

        .chip.ativo {
            color: #fff;
            border-color: transparent;
            background: linear-gradient(135deg, #00CFFF, #A020F0);
            box-shadow: 0 0 14px rgba(160,32,240,.35);
        }

        .chip-som[aria-pressed="true"] {
            border-color: var(--amarelo);
            color: var(--amarelo);
        }

        /* --- Seções --- */
        .secao-titulo {
            position: relative;
            z-index: 1;
            max-width: 620px;
            margin: 6px auto 16px;
            text-align: left;
            font-size: 10px;
            color: var(--texto);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .secao-titulo::after {
            content: "";
            flex: 1;
            height: 2px;
            border-radius: 2px;
            background: var(--marca);
            opacity: .55;
        }

        .secao-titulo span { color: var(--amarelo); }

        .grid {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            max-width: 620px;
            margin: 0 auto 30px;
        }

        @media (min-width: 560px) {
            .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
        }

        .vazio {
            position: relative;
            z-index: 1;
            max-width: 420px;
            margin: 0 auto 30px;
            font-size: 11px;
            line-height: 2;
            color: var(--texto-dim);
            padding: 22px 16px;
            border: 1px dashed var(--linha);
            border-radius: 12px;
        }

        /* --- Jogados recentemente --- */
        .recentes {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 14px;
            max-width: 620px;
            margin: 0 auto 30px;
            padding: 4px 4px 12px;
            overflow-x: auto;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #3a2f58 transparent;
        }

        .recente {
            flex: 0 0 132px;
            scroll-snap-align: start;
            cursor: default;
            color: #fff;
            background: linear-gradient(165deg, var(--card), var(--card-2));
            border: 1px solid rgba(255,215,0,.45);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 0 14px rgba(255,215,0,.10);
            animation: entrarCartucho .42s cubic-bezier(.2,.8,.3,1) backwards;
        }

        .dica-recentes {
            position: relative;
            z-index: 1;
            max-width: 620px;
            margin: -6px auto 12px;
            text-align: left;
            font-size: 10px;
            line-height: 1.9;
            color: var(--texto-dim);
        }

        .recente img {
            width: 100%;
            aspect-ratio: 690 / 490;
            object-fit: contain;
            border-radius: 6px;
            display: block;
            background: #07040f;
            margin-bottom: 8px;
        }

        .recente span {
            display: block;
            font-size: 11px;
            line-height: 1.6;
            color: #e6dff5;
            min-height: 28px;
            overflow: hidden;
        }

        .cartucho {
            position: relative;
            border-radius: 12px;
            background: linear-gradient(165deg, var(--card), var(--card-2));
            padding: 12px;
            border: 1px solid var(--linha);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
            animation: entrarCartucho .42s cubic-bezier(.2,.8,.3,1) backwards;
        }

        @keyframes entrarCartucho {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: none; }
        }

        .sem-anim .cartucho,
        .sem-anim .recente { animation: none; }

        .capa { position: relative; margin-bottom: 10px; }

        .capa img {
            width: 100%;
            border-radius: 6px;
            display: block;
            aspect-ratio: 690 / 490;
            object-fit: contain;
            background: #07040f;
        }

        .selo {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 27px;
            height: 27px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .selo svg { display: block; }

        .selo-lock {
            background: rgba(11,7,20,.76);
            border: 1px solid rgba(255,215,0,.55);
            color: var(--amarelo);
            box-shadow: 0 0 12px rgba(255,215,0,.25);
        }

        .selo-ok {
            background: rgba(11,7,20,.76);
            border: 1px solid rgba(0,207,255,.7);
            color: var(--azul);
            box-shadow: 0 0 12px rgba(0,207,255,.35);
        }

        /* --- Estrela de favorito --- */
        .btn-fav {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #cfc7e6;
            background: rgba(11,7,20,.76);
            border: 1px solid rgba(255,255,255,.28);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: transform .15s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
        }

        .btn-fav svg {
            display: block;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linejoin: round;
            transition: fill .2s ease;
        }

        .btn-fav:hover { color: #fff; border-color: var(--amarelo); }
        .btn-fav:active { transform: scale(.88); }

        .btn-fav.ativo {
            color: var(--amarelo);
            border-color: rgba(255,215,0,.8);
            box-shadow: 0 0 12px rgba(255,215,0,.45);
        }

        .btn-fav.ativo svg { fill: currentColor; }

        .cartucho h3 {
            font-size: 11px;
            color: #c9c1e0;
            line-height: 1.6;
            margin: 0 0 10px;
            min-height: 36px;
        }

        .cartucho h3.misterio {
            color: #6f6590;
            font-size: 12px;
            letter-spacing: 7px;
            text-indent: 7px;
            text-shadow: 0 0 10px rgba(160,32,240,.3);
        }

        .bloqueado img { filter: grayscale(100%) brightness(.55) contrast(1.1); }

        .bloqueado .capa::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 6px;
            background: linear-gradient(180deg, rgba(11,7,20,.10), rgba(11,7,20,.45));
            pointer-events: none;
        }

        .bloqueado:hover {
            transform: translateY(-3px);
            border-color: rgba(255,215,0,.45);
            box-shadow: 0 10px 26px rgba(255,215,0,.12);
        }

        .btn-comprar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            background: rgba(255,255,255,.04);
            color: #e6dff5;
            border: 1px solid #3a2f58;
            padding: 10px;
            font-size: 10px;
            font-family: 'Jersey Retro', 'Press Start 2P', monospace;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: .5px;
            transition: background .2s, border-color .2s, color .2s, transform .12s;
        }

        .btn-comprar svg { flex: 0 0 auto; }

        .btn-comprar:hover {
            background: rgba(255,140,0,.15);
            border-color: var(--laranja);
            color: #fff;
        }

        .btn-comprar:active { transform: scale(.96); }

        .desbloqueado {
            border-color: rgba(0,207,255,.5);
            box-shadow: 0 0 18px rgba(0,207,255,.12), inset 0 0 22px rgba(160,32,240,.07);
        }

        .desbloqueado h3 { color: #fff; }

        .desbloqueado:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 26px rgba(160,32,240,.25), inset 0 0 22px rgba(0,207,255,.06);
        }

        .desbloqueado.novo {
            border-color: var(--amarelo);
            box-shadow: 0 0 22px rgba(255,215,0,.35);
        }

        .etiqueta-ok {
            background: linear-gradient(135deg, #00CFFF, #A020F0);
            color: #fff;
            font-size: 9px;
            padding: 9px 4px;
            border-radius: 10px;
            width: 100%;
            text-align: center;
            letter-spacing: .5px;
            box-shadow: 0 0 14px rgba(160,32,240,.35);
        }

        /* --- Esqueleto --- */
        .esqueleto {
            border-radius: 12px;
            background: linear-gradient(165deg, var(--card), var(--card-2));
            border: 1px solid var(--linha);
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        .esqueleto .bloco { background: #1c1532; border-radius: 6px; margin-bottom: 10px; }
        .esqueleto .bloco.capa { aspect-ratio: 690 / 490; width: 100%; }
        .esqueleto .bloco.linha { height: 10px; width: 80%; margin-left: auto; margin-right: auto; }
        .esqueleto .bloco.linha.curta { width: 55%; }

        .esqueleto::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.07) 50%, transparent 80%);
            transform: translateX(-100%);
            animation: brilho 1.3s infinite;
        }

        @keyframes brilho { to { transform: translateX(100%); } }

        /* --- Botão voltar (fixo no topo) --- */
        .btn-voltar {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 50;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 18px 8px 8px;
            font-family: 'Jersey Retro', 'Press Start 2P', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            color: #fff;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 999px;
            background:
                linear-gradient(#0D0818, #0D0818) padding-box,
                linear-gradient(90deg, #00CFFF, #A020F0, #FF8C00, #FFD700) border-box;
            box-shadow: 0 6px 20px rgba(0,0,0,.6), 0 0 16px rgba(160,32,240,.3);
            transition: transform .15s ease, box-shadow .2s ease;
        }

        .btn-voltar .seta {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #00CFFF, #A020F0);
        }

        .btn-voltar .seta svg { display: block; transition: transform .2s ease; }
        .btn-voltar:hover { box-shadow: 0 6px 20px rgba(0,0,0,.6), 0 0 22px rgba(0,207,255,.45); }
        .btn-voltar:hover .seta svg { transform: translateX(-2px); }
        .btn-voltar:active { transform: scale(.95); }

        .btn-voltar:focus-visible,
        .btn-comprar:focus-visible,
        .btn-fav:focus-visible,
        .recente:focus-visible,
        .chip:focus-visible,
        .btn-celebra:focus-visible {
            outline: 2px solid var(--azul);
            outline-offset: 3px;
        }

        .aviso-erro {
            position: relative;
            z-index: 1;
            color: #ff9a9a;
            font-size: 11px;
            line-height: 1.9;
            margin-top: 24px;
        }

        /* --- Celebração de novo cartucho --- */
        .celebra {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(7,4,15,.88);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .celebra.aberta { display: flex; animation: aparecer .3s ease; }

        @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

        .celebra-caixa {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 320px;
            text-align: center;
            padding: 26px 20px 22px;
            border-radius: 18px;
            background: linear-gradient(165deg, #1a1230, #0F0A1C);
            border: 2px solid transparent;
            background:
                linear-gradient(165deg, #1a1230, #0F0A1C) padding-box,
                linear-gradient(90deg, #00CFFF, #A020F0, #FF8C00, #FFD700) border-box;
            box-shadow: 0 0 40px rgba(160,32,240,.45);
            animation: subir .55s cubic-bezier(.2,.9,.3,1.2);
        }

        @keyframes subir {
            from { opacity: 0; transform: translateY(40px) scale(.9); }
            to   { opacity: 1; transform: none; }
        }

        .celebra-titulo {
            font-size: 11px;
            line-height: 1.7;
            margin: 0 0 18px;
            background: var(--marca);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .celebra-capa {
            width: 84%;
            aspect-ratio: 690 / 490;
            object-fit: contain;
            border-radius: 12px;
            display: block;
            margin: 0 auto 16px;
            box-shadow: 0 0 30px rgba(0,207,255,.45);
            animation: entrarNaEstante .9s cubic-bezier(.2,.9,.3,1.1) .15s backwards;
        }

        @keyframes entrarNaEstante {
            from { opacity: 0; transform: translateY(-60px) rotate(-8deg) scale(.6); }
            to   { opacity: 1; transform: none; }
        }

        .celebra-nome {
            font-size: 10px;
            color: #fff;
            line-height: 1.7;
            margin: 0 0 8px;
        }

        .celebra-extra {
            font-size: 10px;
            color: var(--texto-dim);
            line-height: 1.8;
            margin: 0 0 18px;
        }

        .btn-celebra {
            font-family: 'Jersey Retro', 'Press Start 2P', monospace;
            font-size: 10px;
            color: #fff;
            padding: 13px 24px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, #00CFFF, #A020F0);
            box-shadow: 0 0 18px rgba(160,32,240,.5);
            transition: transform .12s;
        }

        .btn-celebra:active { transform: scale(.95); }

        .confete {
            position: fixed;
            top: -14px;
            width: 9px;
            height: 14px;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            animation: cair linear forwards;
        }

        @keyframes cair {
            0%   { opacity: 1; transform: translateY(0) rotate(0); }
            100% { opacity: 1; transform: translateY(105vh) rotate(720deg); }
        }

        /* --- Item 14: compartilhar estante --- */
        .btn-compartilhar {
            font-family: 'Jersey Retro', 'Press Start 2P', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            color: #fff;
            cursor: pointer;
            padding: 12px 18px;
            border: 2px solid transparent;
            border-radius: 999px;
            background:
                linear-gradient(#0D0818, #0D0818) padding-box,
                linear-gradient(90deg, #00CFFF, #A020F0, #FF8C00, #FFD700) border-box;
            box-shadow: 0 0 16px rgba(160,32,240,.28);
            transition: transform .12s ease, box-shadow .2s ease;
        }

        .btn-compartilhar:hover { box-shadow: 0 0 22px rgba(0,207,255,.45); }
        .btn-compartilhar:active { transform: scale(.96); }
        .btn-compartilhar:disabled { opacity: .55; cursor: progress; }
        .btn-compartilhar:focus-visible { outline: 2px solid var(--azul); outline-offset: 3px; }

        .compartilhar-aviso {
            font-size: 10px;
            line-height: 1.8;
            color: var(--texto-dim);
            margin: 0;
        }

        .compartilhar-aviso:empty { display: none; }

        .partilha-caixa { max-width: 340px; }

        .partilha-img {
            width: 100%;
            display: block;
            border-radius: 12px;
            margin: 0 auto 16px;
            background: #07040f;
            box-shadow: 0 0 26px rgba(0,207,255,.35);
        }

        .partilha-acoes {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn-partilha {
            flex: 1 1 0;
            font-family: 'Jersey Retro', 'Press Start 2P', monospace;
            font-size: 10px;
            letter-spacing: .5px;
            color: #fff;
            padding: 12px 10px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, #00CFFF, #A020F0);
            box-shadow: 0 0 16px rgba(160,32,240,.45);
            transition: transform .12s;
        }

        .btn-partilha:active { transform: scale(.95); }

        .btn-partilha.secundario {
            background: rgba(255,255,255,.05);
            border: 1px solid #3a2f58;
            box-shadow: none;
        }

        .btn-partilha.fechar {
            flex: none;
            width: 100%;
            background: none;
            border: 1px solid #3a2f58;
            color: var(--texto-dim);
            box-shadow: none;
        }

        .btn-partilha:focus-visible { outline: 2px solid var(--azul); outline-offset: 3px; }

        @media (prefers-reduced-motion: reduce) {
            .partilha-caixa { animation: none; }
            .btn-partilha, .btn-compartilhar { transition: none; }
        }
        
        @media (prefers-reduced-motion: reduce) {
            .cartucho, .recente, .esqueleto::after, .celebra.aberta,
            .celebra-caixa, .celebra-capa { animation: none; }
            .btn-voltar .seta svg, .barra-fill, .btn-fav, .recente { transition: none; }
            .confete { display: none; }
        }
    </style>
</head>
<body>
    <button class="btn-voltar" type="button" onclick="voltar()" aria-label="Voltar">
        <span class="seta">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                <path d="M15 5l-7 7 7 7" fill="none" stroke="#fff"
                      stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        VOLTAR
    </button>

    <h1><span class="icone-trofeu">🏆</span> <span class="titulo">MEUS CARTUCHOS</span></h1>
    <p class="sub">Complete sua estante escaneando novos cartuchos Retrô NFC</p>

    <div class="progresso" id="progresso" style="display:none;">
        <div class="progresso-texto" id="progressoTexto"></div>
        <div class="barra"><div class="barra-fill" id="barraFill"></div></div>
    </div>

    <div class="ferramentas" id="ferramentas" style="display:none;">
        <input class="busca" id="campoBusca" type="search" autocomplete="off"
               placeholder="BUSCAR NA MINHA ESTANTE" aria-label="Buscar na minha estante">
        <div class="linha-filtros">
            <button class="btn-compartilhar" id="btnCompartilhar" type="button">COMPARTILHAR ESTANTE</button>
            <p class="compartilhar-aviso" id="compartilharAviso" role="status" aria-live="polite"></p>
            <button class="chip ativo" type="button" data-filtro="todos">TODOS</button>
            <button class="chip" type="button" data-filtro="meus">MEUS</button>
            <button class="chip" type="button" data-filtro="favoritos">★ FAVORITOS</button>
            <button class="chip" type="button" data-filtro="faltam">FALTAM</button>
            <button class="chip chip-som" type="button" id="btnSom" aria-pressed="false"
            aria-label="Ativar ou desativar a música e os efeitos sonoros">🔇 SOM</button>
        </div>
    </div>

    <div id="conteudo"></div>
    <div class="aviso-erro" id="avisoErro" style="display:none;"></div>

    <div class="celebra" id="partilha" role="dialog" aria-modal="true" aria-labelledby="partilhaTitulo">
        <div class="celebra-caixa partilha-caixa">
            <p class="celebra-titulo" id="partilhaTitulo">SUA ESTANTE EM UMA IMAGEM</p>
            <img class="partilha-img" id="partilhaImg" alt="Previa do card da sua estante">
            <div class="partilha-acoes">
                <button class="btn-partilha" id="partilhaEnviar" type="button">COMPARTILHAR</button>
                <button class="btn-partilha secundario" id="partilhaBaixar" type="button">BAIXAR</button>
            </div>
            <button class="btn-partilha fechar" id="partilhaFechar" type="button">FECHAR</button>
        </div>
    </div>
    <div class="celebra" id="celebra" role="dialog" aria-modal="true" aria-labelledby="celebraTitulo">
        <div class="celebra-caixa">
            <p class="celebra-titulo" id="celebraTitulo">NOVO CARTUCHO NA SUA ESTANTE!</p>
            <img class="celebra-capa" id="celebraCapa" src="" alt="">
            <p class="celebra-nome" id="celebraNome"></p>
            <p class="celebra-extra" id="celebraExtra"></p>
            <button class="btn-celebra" id="celebraFechar" type="button">BORA!</button>
        </div>
    </div>

    <script>
        const URL_BACKEND    = "https://script.google.com/macros/s/AKfycbw2aJCwpgq1OJ1fVSXUz8hUMCK7M2Ho1l7HdUKGf8hF4rbS2FFEDGiyBW6FA03yRTz_/exec";
        const CHAVE_COLECAO  = 'retronfc_colecao';
        const CHAVE_JOGOS    = 'retronfc_games_cache';
        const CHAVE_NOME     = 'retronfc_nome';
        const CHAVE_ID       = 'retronfc_id_curto';
        const CHAVE_VISITAS  = 'retronfc_visitas';
        const CHAVE_VISTOS   = 'retronfc_vistos';
        const CHAVE_SOM      = 'retronfc_som';
        const CHAVE_FAVS     = 'retronfc_favoritos';
        const CHAVE_RECENTES = 'retronfc_recentes';
        const APP_VERSAO     = "9.0";

        const VOLUME_NORMAL     = 0.04;   // 4%
        const VOLUME_CELEBRACAO = 0.015;  // 1,5%

        const estado = {
            games: [], filtro: 'todos', busca: '',
            celebrou: false, primeiraPintura: true, semAnimacao: false
        };

        /*
         * Música exclusiva desta página.
         *
         * O botão VER MEUS CARTUCHOS deve abrir:
         * colecao.html?musica=1
         *
         * A autorização vale somente para este documento.
         * Não é gravada no localStorage nem no sessionStorage.
         */
        const entradaMusical = (function () {
            const url = new URL(window.location.href);
            const liberada = url.searchParams.get('musica') === '1';

            if (url.searchParams.has('musica')) {
                url.searchParams.delete('musica');

                try {
                    window.history.replaceState(
                        window.history.state,
                        '',
                        url.pathname + url.search + url.hash
                    );
                } catch (e) {}
            }

            return liberada;
        })();

        const musica = new Audio();
        musica.loop = true;
        musica.preload = 'none';
        musica.volume = VOLUME_NORMAL;

        let paginaAtiva = true;
        let iniciandoMusica = false;
        let celebrando = false;

        function voltar() {
            paginaAtiva = false;
            pausarMusica();

            if (history.length > 1) history.back();
            else window.location.href = 'index.html';
        }

        function esc(t) {
            return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function normalizar(t) {
            return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function lerLista(chave) {
            try {
                const v = JSON.parse(localStorage.getItem(chave) || '[]');
                return Array.isArray(v) ? v : [];
            } catch (e) { return []; }
        }

        function salvarLista(chave, lista) {
            try { localStorage.setItem(chave, JSON.stringify(lista)); } catch (e) {}
        }

        function obterNome() {
            try { return (localStorage.getItem(CHAVE_NOME) || '').trim(); } catch (e) { return ''; }
        }

        function obterIdCurto() {
            try {
                let id = localStorage.getItem(CHAVE_ID);
                if (!id) {
                    id = Math.random().toString(36).substring(2, 6).toUpperCase();
                    localStorage.setItem(CHAVE_ID, id);
                }
                return id;
            } catch (e) { return ''; }
        }

        function obterAparelho() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua))         return "Android";
            if (/iPhone|iPad|iPod/i.test(ua)) return "iOS (Apple)";
            if (/windows/i.test(ua))         return "Windows PC";
            if (/macintosh/i.test(ua))       return "Mac OS";
            return "Outro";
        }

        function contarCartuchos() { return lerLista(CHAVE_COLECAO).length; }

        function classificarVisita() {
            try {
                const visitas = parseInt(localStorage.getItem(CHAVE_VISITAS) || "0", 10);
                return visitas <= 1 ? "Primeira visita" : "Recorrente";
            } catch (e) { return "—"; }
        }

        function rastrearCompra(nomeJogo, urlZap) {
            const payload = JSON.stringify({
                origemRequisicao: "SiteRetroNFC",
                tipo: "Compra",
                jogo: nomeJogo,
                nome: obterNome(),
                jogador: obterIdCurto(),
                aparelho: obterAparelho(),
                cartuchos: contarCartuchos(),
                visitante: classificarVisita(),
                versao: APP_VERSAO
            });

            try {
                fetch(URL_BACKEND, {
                    method: 'POST',
                    mode: 'no-cors',
                    keepalive: true,
                    headers: { 'Content-Type': 'text/plain' },
                    body: payload
                });
            } catch (e) {
                console.error("Erro ao registrar compra:", e);
            }

            window.open(urlZap, '_blank');
        }

        function mostrarEsqueleto() {
            const c = document.getElementById('conteudo');
            let html = '<div class="grid">';
            for (let i = 0; i < 6; i++) {
                html += '<div class="esqueleto"><div class="bloco capa"></div><div class="bloco linha"></div><div class="bloco linha curta"></div></div>';
            }
            c.innerHTML = html + '</div>';
        }

        function lerCacheJogos() {
            try {
                const bruto = localStorage.getItem(CHAVE_JOGOS);
                if (!bruto) return null;
                const dados = JSON.parse(bruto);
                return (dados && Array.isArray(dados.games)) ? dados.games : null;
            } catch (e) { return null; }
        }

        function salvarCacheJogos(games) {
            try { localStorage.setItem(CHAVE_JOGOS, JSON.stringify({ games: games })); } catch (e) {}
        }

        const SELO_LOCK = '<span class="selo selo-lock" aria-hidden="true">' +
            '<svg viewBox="0 0 24 24" width="13" height="13">' +
            '<rect x="4.5" y="10.5" width="15" height="10" rx="2.6" fill="none" stroke="currentColor" stroke-width="2"/>' +
            '<path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
            '</svg></span>';

        const SELO_OK = '<span class="selo selo-ok" aria-hidden="true">' +
            '<svg viewBox="0 0 24 24" width="13" height="13">' +
            '<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg></span>';

        const ICONE_CARRINHO = '<svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true">' +
            '<path d="M3 4h2.2l2.4 10.2h9.6L19 7H6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
            '<circle cx="9.5" cy="19" r="1.6" fill="currentColor"/>' +
            '<circle cx="17" cy="19" r="1.6" fill="currentColor"/>' +
            '</svg>';

        const ICONE_ESTRELA = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">' +
            '<polygon points="12,2.8 14.9,8.9 21.5,9.7 16.6,14.3 17.9,20.9 12,17.6 6.1,20.9 7.4,14.3 2.5,9.7 9.1,8.9"/>' +
            '</svg>';

        /* ---------- Favoritos ---------- */
        function ehFavorito(key) {
            return lerLista(CHAVE_FAVS).indexOf(key) !== -1;
        }

        function alternarFavorito(key) {
            const lista = lerLista(CHAVE_FAVS);
            const pos = lista.indexOf(key);
            if (pos === -1) lista.push(key);
            else lista.splice(pos, 1);
            salvarLista(CHAVE_FAVS, lista);

            const ativo = pos === -1;

            // Atualiza todas as estrelas desse jogo sem redesenhar a tela.
            document.querySelectorAll('.btn-fav').forEach(function (b) {
                if (b.getAttribute('data-key') !== key) return;
                b.classList.toggle('ativo', ativo);
                b.setAttribute('aria-pressed', ativo ? 'true' : 'false');
            });

            // No filtro FAVORITOS o cartucho precisa sair da lista.
            if (estado.filtro === 'favoritos' && estado.games.length) {
                estado.semAnimacao = true;
                desenharColecao();
            }
        }

        /* ---------- Som e música da coleção ---------- */
        function somAtivo() {
            try { return localStorage.getItem(CHAVE_SOM) !== '0'; } catch (e) { return true; }
        }

        function atualizarBotaoSom() {
            const b = document.getElementById('btnSom');
            const on = somAtivo();
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
            b.textContent = on ? '🔊 SOM' : '🔇 SOM';
        }

        function ajustarVolumeMusica() {
            musica.volume = celebrando ? VOLUME_CELEBRACAO : VOLUME_NORMAL;
        }

        function podeTocarMusica() {
            return entradaMusical &&
                somAtivo() &&
                paginaAtiva &&
                !document.hidden;
        }

        function pausarMusica() {
            try { musica.pause(); } catch (e) {}
        }

        function iniciarMusica() {
            if (!podeTocarMusica() || iniciandoMusica || !musica.paused) return;

            iniciandoMusica = true;

            try {
                if (!musica.getAttribute('src')) {
                    musica.src = 'assets/audio/tg.mp3';
                }

                ajustarVolumeMusica();

                const tentativa = musica.play();

                if (tentativa && typeof tentativa.then === 'function') {
                    tentativa.then(function () {
                        iniciandoMusica = false;

                        // Evita reprodução tardia após sair ou desligar o som.
                        if (!podeTocarMusica()) pausarMusica();
                    }).catch(function () {
                        iniciandoMusica = false;

                        // Se o navegador bloquear o autoplay,
                        // uma interação na coleção tentará novamente.
                    });
                } else {
                    iniciandoMusica = false;
                    if (!podeTocarMusica()) pausarMusica();
                }
            } catch (e) {
                iniciandoMusica = false;
            }
        }

        function tentarMusicaNaInteracao(e) {
            const alvo = e.target;

            // Não inicia música enquanto a pessoa está saindo
            // ou antes de o botão de som processar o clique.
            if (alvo && typeof alvo.closest === 'function') {
                if (alvo.closest('.btn-voltar, #btnSom')) return;
            }

            if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;

            iniciarMusica();
        }

        function inicializarMusica() {
            if (!entradaMusical) return;

            document.addEventListener('click', tentarMusicaNaInteracao, true);
            document.addEventListener('touchend', tentarMusicaNaInteracao, {
                capture: true,
                passive: true
            });
            document.addEventListener('keydown', tentarMusicaNaInteracao, true);

            iniciarMusica();
        }

        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                pausarMusica();
            } else {
                iniciarMusica();
            }
        });

        window.addEventListener('pagehide', function () {
            paginaAtiva = false;
            pausarMusica();
        });

        window.addEventListener('pageshow', function (ev) {
            paginaAtiva = true;
            iniciarMusica();

            // Voltando de um jogo: atualiza "jogados recentemente".
            if (ev && ev.persisted && estado.games.length) {
                estado.semAnimacao = true;
                desenharColecao();
            }
        });

        // Som retrô: toca apenas quando um cartucho novo é desbloqueado.
        function tocarSomCelebracao() {
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                const ctx = new Ctx();
                const notas = [523.25, 659.25, 783.99, 1046.5];

                function agendar() {
                    if (!somAtivo() || !paginaAtiva || document.hidden) {
                        try { ctx.close(); } catch (e) {}
                        return;
                    }

                    notas.forEach(function (freq, i) {
                        const osc = ctx.createOscillator();
                        const gan = ctx.createGain();
                        const t = ctx.currentTime + i * 0.11;
                        osc.type = 'square';
                        osc.frequency.value = freq;
                        gan.gain.setValueAtTime(0.0001, t);
                        gan.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
                        gan.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
                        osc.connect(gan);
                        gan.connect(ctx.destination);
                        osc.start(t);
                        osc.stop(t + 0.22);
                    });
                    setTimeout(function () { try { ctx.close(); } catch (e) {} }, 1500);
                }

                if (ctx.state === 'suspended') {
                    try {
                        const retomada = ctx.resume();
                        if (retomada && retomada.catch) retomada.catch(function () {});
                    } catch (e) {}
                }

                setTimeout(function () {
                    if (ctx.state === 'running') {
                        agendar();
                        return;
                    }

                    // Navegador bloqueou: tenta no primeiro toque da pessoa.
                    let tocou = false;
                    const liberar = function () {
                        if (tocou) return;
                        tocou = true;
                        ['pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
                            document.removeEventListener(ev, liberar, true);
                        });
                        ctx.resume().then(agendar).catch(function () {});
                    };
                    ['pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
                        document.addEventListener(ev, liberar, true);
                    });
                }, 120);
            } catch (e) {}
        }

        /* ---------- Desenho da estante ---------- */
        function cartaoColecionado(game, indice, ehNovo) {
            const fav = ehFavorito(game.key);
            const card = document.createElement('div');
            card.className = "cartucho desbloqueado" + (ehNovo ? " novo" : "");
            card.style.animationDelay = (indice * 45) + 'ms';
            card.innerHTML =
                '<div class="capa">' +
                    '<img src="' + esc(game.cover) + '" alt="' + esc(game.title) + '" loading="lazy" decoding="async">' +
                    '<button class="btn-fav' + (fav ? ' ativo' : '') + '" type="button"' +
                        ' data-key="' + esc(game.key) + '"' +
                        ' aria-pressed="' + (fav ? 'true' : 'false') + '"' +
                        ' aria-label="Favoritar ' + esc(game.title) + '">' + ICONE_ESTRELA + '</button>' +
                    SELO_OK +
                '</div>' +
                '<h3>' + esc(game.title) + '</h3>' +
                '<div class="etiqueta-ok">COLECIONADO</div>';

            card.querySelector('.btn-fav').addEventListener('click', function () {
                alternarFavorito(game.key);
            });
            return card;
        }

        function cartaoBloqueado(game, indice) {
            const numeroWhatsApp = "5519992087429";
            const textoZap = encodeURIComponent("Fala, Retrô NFC! 🎮✨\nVi na minha Estante Digital que ainda falta este clássico:\n\n🔥 *" + game.title + "*\n\nQuero completar minha coleção. Como finalizamos a compra? 🚀");
            const urlZap = "https://wa.me/" + numeroWhatsApp + "?text=" + textoZap;

            const card = document.createElement('div');
            card.className = "cartucho bloqueado";
            card.style.animationDelay = (indice * 45) + 'ms';
            card.innerHTML =
                '<div class="capa">' +
                    '<img src="' + esc(game.cover) + '" alt="Cartucho bloqueado" loading="lazy" decoding="async">' +
                    SELO_LOCK +
                '</div>' +
                '<h3 class="misterio">???</h3>' +
                '<button class="btn-comprar" type="button">' + ICONE_CARRINHO + ' COMPRAR</button>';

            card.querySelector('.btn-comprar').addEventListener('click', function () {
                rastrearCompra(game.title, urlZap);
            });
            return card;
        }

        function cartaoRecente(game, indice) {
            const d = document.createElement('div');
            d.className = 'recente';
            d.style.animationDelay = (indice * 45) + 'ms';
            d.innerHTML =
                '<img src="' + esc(game.cover) + '" alt="' + esc(game.title) + '" loading="lazy" decoding="async">' +
                '<span>' + esc(game.title) + '</span>';
            return d;
        }

        function criarSecao(titulo, qtd, cards, mensagemVazia) {
            const frag = document.createDocumentFragment();

            const h = document.createElement('div');
            h.className = 'secao-titulo';
            h.innerHTML = esc(titulo) + ' <span>' + qtd + '</span>';
            frag.appendChild(h);

            if (cards.length === 0) {
                const v = document.createElement('div');
                v.className = 'vazio';
                v.textContent = mensagemVazia;
                frag.appendChild(v);
            } else {
                const g = document.createElement('div');
                g.className = 'grid';
                cards.forEach(function (c) { g.appendChild(c); });
                frag.appendChild(g);
            }
            return frag;
        }

        function criarSecaoRecentes(jogos) {
            const frag = document.createDocumentFragment();

            const h = document.createElement('div');
            h.className = 'secao-titulo';
            h.innerHTML = 'JOGADOS RECENTEMENTE <span>' + jogos.length + '</span>';
            frag.appendChild(h);

            const dica = document.createElement('div');
            dica.className = 'dica-recentes';
            dica.textContent = 'PARA JOGAR DE NOVO, ENCOSTE A TAG DO CARTUCHO NO CELULAR.';
            frag.appendChild(dica);

            const faixa = document.createElement('div');
            faixa.className = 'recentes';
            jogos.forEach(function (g, i) { faixa.appendChild(cartaoRecente(g, i)); });
            frag.appendChild(faixa);
            return frag;
        }

        function atualizarProgresso(tenho, total) {
            const box = document.getElementById('progresso');
            const txt = document.getElementById('progressoTexto');
            const fill = document.getElementById('barraFill');
            box.style.display = 'block';

            const pct = total > 0 ? Math.round((tenho / total) * 100) : 0;
            txt.innerHTML = '<b>' + tenho + '</b> DE <b>' + total + '</b> CARTUCHOS · ' + pct + '%';

            // As cores vão surgindo conforme a barra enche.
            fill.style.backgroundSize = pct > 0 ? (10000 / pct) + '% 100%' : '100% 100%';
            if (estado.primeiraPintura) {
                fill.style.width = '0';
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () { fill.style.width = pct + '%'; });
                });
            } else {
                fill.style.width = pct + '%';
            }
        }

        function desenharColecao() {
            const games = estado.games;
            const salva = lerLista(CHAVE_COLECAO);
            const favs = lerLista(CHAVE_FAVS);
            const conteudo = document.getElementById('conteudo');
            const busca = normalizar(estado.busca.trim());

            document.getElementById('ferramentas').style.display = 'flex';
            conteudo.classList.toggle('sem-anim', !!estado.semAnimacao);

            const meus = games
                .filter(function (g) { return salva.indexOf(g.key) !== -1; })
                .sort(function (a, b) { return salva.indexOf(b.key) - salva.indexOf(a.key); });

            const faltam = games.filter(function (g) { return salva.indexOf(g.key) === -1; });

            // Últimos jogados (mais recente primeiro), só os que existem no catálogo.
            const recentes = lerLista(CHAVE_RECENTES)
                .map(function (k) { return games.find(function (g) { return g.key === k; }); })
                .filter(function (g) { return !!g; })
                .slice(0, 8);

            atualizarProgresso(meus.length, games.length);

            // A busca só vale para cartuchos já colecionados.
            let meusVisiveis = busca
                ? meus.filter(function (g) { return normalizar(g.title).indexOf(busca) !== -1; })
                : meus;

            if (estado.filtro === 'favoritos') {
                meusVisiveis = meusVisiveis.filter(function (g) { return favs.indexOf(g.key) !== -1; });
            }

            const mostrarRecentes = (estado.filtro === 'todos' || estado.filtro === 'meus') &&
                !busca && recentes.length > 0;
            const mostrarMeus = estado.filtro !== 'faltam';
            const mostrarFaltam = estado.filtro !== 'meus' && estado.filtro !== 'favoritos' && !busca;

            conteudo.innerHTML = '';

            if (mostrarRecentes) {
                conteudo.appendChild(criarSecaoRecentes(recentes));
            }

            if (mostrarMeus) {
                const cards = meusVisiveis.map(function (g, i) {
                    const ehNovo = estado.novosKeys && estado.novosKeys.indexOf(g.key) !== -1;
                    return cartaoColecionado(g, i, ehNovo);
                });

                let vazioMsg;
                if (busca) {
                    vazioMsg = 'NENHUM CARTUCHO ENCONTRADO COM ESSE NOME.';
                } else if (estado.filtro === 'favoritos') {
                    vazioMsg = 'NENHUM FAVORITO AINDA. TOQUE NA ESTRELA DE UM CARTUCHO PARA FAVORITAR!';
                } else {
                    vazioMsg = 'ESTANTE VAZIA. ENCOSTE UM CARTUCHO RETRO NFC!';
                }

                const titulo = estado.filtro === 'favoritos' ? 'FAVORITOS' : 'SUA ESTANTE';
                conteudo.appendChild(criarSecao(titulo, meusVisiveis.length, cards, vazioMsg));
            }

            if (mostrarFaltam) {
                const cards = faltam.map(function (g, i) { return cartaoBloqueado(g, i); });
                conteudo.appendChild(criarSecao('PARA DESCOBRIR', faltam.length, cards,
                    'VENCEDOR! ACERVO DE CARTUCHOS COMPLETO 🏆'));
            }

            estado.primeiraPintura = false;
            estado.semAnimacao = false;
        }

        /* ---------- Celebração ---------- */
        function lancarConfete() {
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const cores = ['#00CFFF', '#A020F0', '#FF8C00', '#FFD700'];
            for (let i = 0; i < 42; i++) {
                const p = document.createElement('i');
                p.className = 'confete';
                p.style.left = (Math.random() * 100) + 'vw';
                p.style.background = cores[i % cores.length];
                p.style.animationDuration = (2.4 + Math.random() * 2.2) + 's';
                p.style.animationDelay = (Math.random() * 0.8) + 's';
                p.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
                document.body.appendChild(p);
                setTimeout(function () { p.remove(); }, 6000);
            }
        }

        function fecharCelebracao() {
            document.getElementById('celebra').classList.remove('aberta');
            document.removeEventListener('keydown', teclaCelebracao);

            celebrando = false;
            ajustarVolumeMusica();

            // Remove o destaque dos cartões novos.
            estado.novosKeys = [];
            desenharColecao();
        }

        function teclaCelebracao(e) {
            if (e.key === 'Escape') fecharCelebracao();
        }

        function abrirCelebracao(game, extras) {
            document.getElementById('celebraCapa').src = game.cover;
            document.getElementById('celebraCapa').alt = game.title;
            document.getElementById('celebraNome').textContent = game.title;
            document.getElementById('celebraExtra').textContent =
                extras > 0 ? ('+ ' + extras + (extras === 1 ? ' OUTRO CARTUCHO NOVO NA ESTANTE' : ' OUTROS CARTUCHOS NOVOS NA ESTANTE')) : 'DIRETO PARA A ESTANTE!';

            celebrando = true;
            ajustarVolumeMusica();

            const el = document.getElementById('celebra');
            el.classList.add('aberta');
            document.addEventListener('keydown', teclaCelebracao);
            document.getElementById('celebraFechar').focus();

            lancarConfete();
            if (somAtivo()) tocarSomCelebracao();
        }

        // Celebra só o que ainda não foi visto.
        // Um cartucho nunca é celebrado duas vezes.
        function verificarNovos() {
            if (estado.celebrou || estado.games.length === 0) return;
            estado.celebrou = true;

            const salva = lerLista(CHAVE_COLECAO);
            const vistos = lerLista(CHAVE_VISTOS);

            const novos = estado.games.filter(function (game) {
                return salva.indexOf(game.key) !== -1 &&
                    vistos.indexOf(game.key) === -1;
            });

            estado.novosKeys = novos.map(function (game) {
                return game.key;
            });

            if (novos.length === 0) return;

            const atualizados = vistos.slice();

            novos.forEach(function (game) {
                if (atualizados.indexOf(game.key) === -1) {
                    atualizados.push(game.key);
                }
            });

            salvarLista(CHAVE_VISTOS, atualizados);
            desenharColecao();
            abrirCelebracao(novos[0], novos.length - 1);
        }

        /* ---------- Carregamento do catálogo ---------- */
        function mostrarErroColecao(erro) {
            console.error('Erro ao carregar a coleção:', erro);

            const aviso = document.getElementById('avisoErro');
            aviso.textContent =
                'FALHA AO ATUALIZAR O CATALOGO. ' +
                'TENTE RECARREGAR A PAGINA.';
            aviso.style.display = 'block';

            if (estado.games.length === 0) {
                const vazio = document.createElement('div');
                vazio.className = 'vazio';
                vazio.textContent =
                    'ERRO AO CARREGAR O CATALOGO. ' +
                    'MAS SUA COLECAO ESTA A SALVO.';

                const conteudo = document.getElementById('conteudo');
                conteudo.replaceChildren(vazio);
            }
        }

        function aplicarCatalogo(games) {
            if (!Array.isArray(games) || games.length === 0) {
                throw new Error('Catálogo vazio ou inválido.');
            }

            const valido = games.every(function (game) {
                return game &&
                    typeof game.key === 'string' &&
                    typeof game.title === 'string' &&
                    typeof game.cover === 'string';
            });

            if (!valido) {
                throw new Error('Há jogos com dados inválidos no catálogo.');
            }

            estado.games = games;
            desenharColecao();
            verificarNovos();
        }

        async function carregarCatalogoColecao() {
            mostrarEsqueleto();

            const cache = lerCacheJogos();

            if (cache && cache.length > 0) {
                try {
                    aplicarCatalogo(cache);
                } catch (erro) {
                    console.warn('Cache do catálogo inválido:', erro);
                }
            }

            const controle = typeof AbortController !== 'undefined'
                ? new AbortController()
                : null;

            const temporizador = controle
                ? setTimeout(function () {
                    controle.abort();
                }, 10000)
                : null;

            try {
                const opcoes = { cache: 'no-store' };

                if (controle) {
                    opcoes.signal = controle.signal;
                }

                const resposta = await fetch('games.json', opcoes);

                if (!resposta.ok) {
                    throw new Error('HTTP ' + resposta.status);
                }

                const dados = await resposta.json();

                if (!dados || !Array.isArray(dados.games)) {
                    throw new Error('games.json inválido.');
                }

                aplicarCatalogo(dados.games);
                salvarCacheJogos(dados.games);

                document.getElementById('avisoErro').style.display = 'none';
            } catch (erro) {
                mostrarErroColecao(erro);
            } finally {
                if (temporizador) {
                    clearTimeout(temporizador);
                }
            }
        }

        /* ---------- Item 14: card compartilhavel da estante ---------- */
        const CARD_LARGURA = 1080;
        const CARD_ALTURA  = 1350;
        const CARD_FONTE   = '"Jersey Retro", "Press Start 2P", monospace';

        let cardBlobAtual = null;
        let cardUrlAtual  = null;

        function carregarImagemCard(src) {
            return new Promise(function (resolve) {
                const img = new Image();
                img.decoding = 'async';
                img.onload = function () { resolve(img); };
                img.onerror = function () { resolve(null); };
                img.src = src;
            });
        }

        function caminhoArredondado(ctx, x, y, w, h, r) {
            const raio = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + raio, y);
            ctx.lineTo(x + w - raio, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + raio);
            ctx.lineTo(x + w, y + h - raio);
            ctx.quadraticCurveTo(x + w, y + h, x + w - raio, y + h);
            ctx.lineTo(x + raio, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - raio);
            ctx.lineTo(x, y + raio);
            ctx.quadraticCurveTo(x, y, x + raio, y);
            ctx.closePath();
        }

        function ajustarFonteCard(ctx, texto, maxLargura, tamanho, peso) {
            let t = tamanho;
            do {
                ctx.font = (peso || '400') + ' ' + t + 'px ' + CARD_FONTE;
                if (ctx.measureText(texto).width <= maxLargura) break;
                t -= 2;
            } while (t > 10);
            return t;
        }

        function meusCartuchosNaOrdem() {
            const salva = lerLista(CHAVE_COLECAO);
            return salva
                .slice()
                .reverse()
                .map(function (k) {
                    return estado.games.find(function (g) { return g.key === k; });
                })
                .filter(function (g) { return !!g; });
        }

        async function gerarCardEstante() {
            if (document.fonts) {
                try {
                    await document.fonts.load('40px "Jersey Retro"');
                    await document.fonts.ready;
                } catch (e) {}
            }

            const meus = meusCartuchosNaOrdem();
            const total = estado.games.length;
            const tenho = meus.length;
            const pct = total > 0 ? Math.round((tenho / total) * 100) : 0;

            const canvas = document.createElement('canvas');
            canvas.width = CARD_LARGURA;
            canvas.height = CARD_ALTURA;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0B0714';
            ctx.fillRect(0, 0, CARD_LARGURA, CARD_ALTURA);

            const brilhoRoxo = ctx.createRadialGradient(540, -80, 0, 540, -80, 780);
            brilhoRoxo.addColorStop(0, 'rgba(160,32,240,0.34)');
            brilhoRoxo.addColorStop(1, 'rgba(160,32,240,0)');
            ctx.fillStyle = brilhoRoxo;
            ctx.fillRect(0, 0, CARD_LARGURA, CARD_ALTURA);

            const brilhoAzul = ctx.createRadialGradient(980, 1240, 0, 980, 1240, 620);
            brilhoAzul.addColorStop(0, 'rgba(0,207,255,0.20)');
            brilhoAzul.addColorStop(1, 'rgba(0,207,255,0)');
            ctx.fillStyle = brilhoAzul;
            ctx.fillRect(0, 0, CARD_LARGURA, CARD_ALTURA);

            ctx.fillStyle = 'rgba(255,255,255,0.022)';
            for (let y = 0; y < CARD_ALTURA; y += 4) {
                ctx.fillRect(0, y, CARD_LARGURA, 1);
            }

            const moldura = ctx.createLinearGradient(0, 0, CARD_LARGURA, CARD_ALTURA);
            moldura.addColorStop(0, '#00CFFF');
            moldura.addColorStop(0.35, '#A020F0');
            moldura.addColorStop(0.7, '#FF8C00');
            moldura.addColorStop(1, '#FFD700');
            ctx.strokeStyle = moldura;
            ctx.lineWidth = 6;
            caminhoArredondado(ctx, 26, 26, CARD_LARGURA - 52, CARD_ALTURA - 52, 34);
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';

            const marca = ctx.createLinearGradient(300, 0, 780, 0);
            marca.addColorStop(0, '#00CFFF');
            marca.addColorStop(0.35, '#A020F0');
            marca.addColorStop(0.7, '#FF8C00');
            marca.addColorStop(1, '#FFD700');

            ajustarFonteCard(ctx, 'RETRO NFC', 700, 44);
            ctx.fillStyle = marca;
            ctx.fillText('RETRO NFC', 540, 132);

            ajustarFonteCard(ctx, 'MINHA ESTANTE', 900, 74);
            ctx.fillStyle = '#ffffff';
            ctx.fillText('MINHA ESTANTE', 540, 268);

            ajustarFonteCard(ctx, tenho + ' DE ' + total + ' CARTUCHOS', 900, 30);
            ctx.fillStyle = '#9a90b5';
            ctx.fillText(tenho + ' DE ' + total + ' CARTUCHOS  \u00b7  ' + pct + '%', 540, 320);

            const barraX = 72;
            const barraY = 352;
            const barraW = CARD_LARGURA - 144;
            const barraH = 22;

            ctx.fillStyle = '#1b1430';
            caminhoArredondado(ctx, barraX, barraY, barraW, barraH, barraH / 2);
            ctx.fill();
            ctx.strokeStyle = '#2a2142';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (pct > 0) {
                ctx.save();
                caminhoArredondado(ctx, barraX, barraY, barraW, barraH, barraH / 2);
                ctx.clip();
                const corBarra = ctx.createLinearGradient(barraX, 0, barraX + barraW, 0);
                corBarra.addColorStop(0, '#00CFFF');
                corBarra.addColorStop(0.34, '#A020F0');
                corBarra.addColorStop(0.67, '#FF8C00');
                corBarra.addColorStop(1, '#FFD700');
                ctx.fillStyle = corBarra;
                ctx.fillRect(barraX, barraY, barraW * (pct / 100), barraH);
                ctx.restore();
            }

            const cols = 4;
            const gap = 18;
            const margem = 72;
            const cw = (CARD_LARGURA - margem * 2 - gap * (cols - 1)) / cols;
            const ch = cw * 490 / 690;
            const y0 = 418;
            const maxTiles = 16;
            const mostrar = tenho > maxTiles ? maxTiles - 1 : tenho;

            const imagens = await Promise.all(
                meus.slice(0, mostrar).map(function (g) {
                    return carregarImagemCard(g.cover);
                })
            );

            for (let i = 0; i < mostrar; i++) {
                const col = i % cols;
                const lin = Math.floor(i / cols);
                const x = margem + col * (cw + gap);
                const y = y0 + lin * (ch + gap);

                ctx.save();
                caminhoArredondado(ctx, x, y, cw, ch, 10);
                ctx.clip();
                ctx.fillStyle = '#07040f';
                ctx.fillRect(x, y, cw, ch);

                const img = imagens[i];
                if (img && img.width > 0 && img.height > 0) {
                    const escala = Math.min(cw / img.width, ch / img.height);
                    const dw = img.width * escala;
                    const dh = img.height * escala;
                    ctx.drawImage(img, x + (cw - dw) / 2, y + (ch - dh) / 2, dw, dh);
                }
                ctx.restore();

                ctx.strokeStyle = 'rgba(0,207,255,0.35)';
                ctx.lineWidth = 2;
                caminhoArredondado(ctx, x + 1, y + 1, cw - 2, ch - 2, 10);
                ctx.stroke();
            }

            if (tenho > maxTiles) {
                const i = mostrar;
                const col = i % cols;
                const lin = Math.floor(i / cols);
                const x = margem + col * (cw + gap);
                const y = y0 + lin * (ch + gap);

                ctx.fillStyle = 'rgba(255,255,255,0.04)';
                caminhoArredondado(ctx, x, y, cw, ch, 10);
                ctx.fill();

                ctx.strokeStyle = moldura;
                ctx.lineWidth = 3;
                caminhoArredondado(ctx, x + 1.5, y + 1.5, cw - 3, ch - 3, 10);
                ctx.stroke();

                const sobra = tenho - mostrar;
                ajustarFonteCard(ctx, '+' + sobra, cw - 24, 54);
                ctx.fillStyle = '#ffffff';
                ctx.fillText('+' + sobra, x + cw / 2, y + ch / 2 + 4);

                ajustarFonteCard(ctx, 'MAIS', cw - 24, 18);
                ctx.fillStyle = '#9a90b5';
                ctx.fillText('MAIS', x + cw / 2, y + ch / 2 + 40);
            }

            const linhaY = 1156;
            const linha = ctx.createLinearGradient(margem, 0, CARD_LARGURA - margem, 0);
            linha.addColorStop(0, 'rgba(0,207,255,0.65)');
            linha.addColorStop(0.5, 'rgba(160,32,240,0.65)');
            linha.addColorStop(1, 'rgba(255,215,0,0.65)');
            ctx.fillStyle = linha;
            ctx.fillRect(margem, linhaY, CARD_LARGURA - margem * 2, 3);

            ajustarFonteCard(ctx, 'RETRO-NFC.PAGES.DEV', 900, 34);
            ctx.fillStyle = '#ffffff';
            ctx.fillText('RETRO-NFC.PAGES.DEV', 540, 1226);

            ajustarFonteCard(ctx, 'ENCOSTE A TAG PARA JOGAR', 900, 24);
            ctx.fillStyle = '#9a90b5';
            ctx.fillText('ENCOSTE A TAG PARA JOGAR', 540, 1276);

            return canvas;
        }

        function arquivoDoCard() {
            if (!cardBlobAtual) return null;
            try {
                return new File([cardBlobAtual], 'retro-nfc-estante.png', { type: 'image/png' });
            } catch (e) {
                return null;
            }
        }

        function podeCompartilharArquivo() {
            const arquivo = arquivoDoCard();
            return !!(arquivo && navigator.canShare && navigator.canShare({ files: [arquivo] }));
        }

        function configurarBotaoEnviar() {
            const botao = document.getElementById('partilhaEnviar');
            botao.style.display = podeCompartilharArquivo() ? '' : 'none';
        }

        function fecharPartilha() {
            document.getElementById('partilha').classList.remove('aberta');
            document.getElementById('partilhaImg').removeAttribute('src');

            if (cardUrlAtual) {
                URL.revokeObjectURL(cardUrlAtual);
                cardUrlAtual = null;
            }
        }

        async function abrirPartilha() {
            const botao = document.getElementById('btnCompartilhar');
            const aviso = document.getElementById('compartilharAviso');

            if (botao.dataset.ocupado === '1') return;

            botao.dataset.ocupado = '1';
            botao.disabled = true;
            aviso.textContent = 'MONTANDO SUA IMAGEM...';

            try {
                if (!estado.games.length) {
                    throw new Error('catalogo indisponivel');
                }

                if (meusCartuchosNaOrdem().length === 0) {
                    aviso.textContent = 'SUA ESTANTE AINDA ESTA VAZIA. ENCOSTE UM CARTUCHO RETRO NFC.';
                    return;
                }

                const canvas = await gerarCardEstante();

                const blob = await new Promise(function (resolve) {
                    canvas.toBlob(resolve, 'image/png');
                });

                if (!blob) throw new Error('falha ao gerar a imagem');

                cardBlobAtual = blob;
                cardUrlAtual = URL.createObjectURL(blob);

                document.getElementById('partilhaImg').src = cardUrlAtual;
                document.getElementById('partilha').classList.add('aberta');
                configurarBotaoEnviar();

                aviso.textContent = '';
            } catch (e) {
                aviso.textContent = 'NAO FOI POSSIVEL MONTAR A IMAGEM. TENTE DE NOVO.';
            } finally {
                botao.dataset.ocupado = '0';
                botao.disabled = false;
            }
        }

        async function enviarCard() {
            const arquivo = arquivoDoCard();
            if (!arquivo) return;

            try {
                await navigator.share({
                    files: [arquivo],
                    title: 'Minha estante Retro NFC',
                    text: 'Minha colecao de cartuchos Retro NFC'
                });
            } catch (e) {}
        }

        function baixarCard() {
            if (!cardBlobAtual) return;

            const url = URL.createObjectURL(cardBlobAtual);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'retro-nfc-estante.png';
            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
        }

        (function iniciarPartilha() {
            const botao = document.getElementById('btnCompartilhar');
            if (!botao) return;

            botao.addEventListener('click', abrirPartilha);
            document.getElementById('partilhaFechar').addEventListener('click', fecharPartilha);
            document.getElementById('partilhaEnviar').addEventListener('click', enviarCard);
            document.getElementById('partilhaBaixar').addEventListener('click', baixarCard);

            document.getElementById('partilha').addEventListener('click', function (evento) {
                if (evento.target === this) fecharPartilha();
            });

            document.addEventListener('keydown', function (evento) {
                if (evento.key !== 'Escape') return;
                if (document.getElementById('partilha').classList.contains('aberta')) {
                    fecharPartilha();
                }
            });
        })();

        /* ---------- Eventos da interface ---------- */
        function inicializarColecao() {
            document.querySelectorAll('[data-filtro]').forEach(function (botao) {
                botao.addEventListener('click', function () {
                    estado.filtro = botao.getAttribute('data-filtro');
                    estado.semAnimacao = true;

                    document.querySelectorAll('[data-filtro]').forEach(function (item) {
                        const ativo =
                            item.getAttribute('data-filtro') === estado.filtro;

                        item.classList.toggle('ativo', ativo);
                        item.setAttribute('aria-pressed', ativo ? 'true' : 'false');
                    });

                    if (estado.games.length > 0) {
                        desenharColecao();
                    }
                });
            });

            document.getElementById('campoBusca').addEventListener(
                'input',
                function (evento) {
                    estado.busca = evento.target.value;
                    estado.semAnimacao = true;

                    if (estado.games.length > 0) {
                        desenharColecao();
                    }
                }
            );

            document.getElementById('btnSom').addEventListener(
                'click',
                function () {
                    const ativar = !somAtivo();

                    try {
                        localStorage.setItem(CHAVE_SOM, ativar ? '1' : '0');
                    } catch (erro) {
                        console.warn('Não foi possível salvar a preferência de som:', erro);
                    }

                    atualizarBotaoSom();

                    if (somAtivo()) {
                        iniciarMusica();
                    } else {
                        pausarMusica();
                    }
                }
            );

            document.getElementById('celebraFechar').addEventListener(
                'click',
                fecharCelebracao
            );

            atualizarBotaoSom();
            inicializarMusica();
            carregarCatalogoColecao();
        }

        window.addEventListener('storage', function (evento) {
            const chaves = [
                CHAVE_COLECAO,
                CHAVE_FAVS,
                CHAVE_RECENTES,
                CHAVE_SOM
            ];

            if (evento.key !== null && chaves.indexOf(evento.key) === -1) {
                return;
            }

            atualizarBotaoSom();

            if (somAtivo()) {
                iniciarMusica();
            } else {
                pausarMusica();
            }

            if (estado.games.length > 0) {
                estado.semAnimacao = true;
                desenharColecao();
            }
        });

        if (document.readyState === 'loading') {
            document.addEventListener(
                'DOMContentLoaded',
                inicializarColecao,
                { once: true }
            );
        } else {
            inicializarColecao();
        }
    </script>
</body>

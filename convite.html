<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Retrô NFC — Convite</title>
    <meta name="theme-color" content="#0B0714">

    <!-- Prévia ao compartilhar o link -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Retrô NFC">
    <meta property="og:title" content="Retrô NFC — Jogue comigo!">
    <meta property="og:description" content="Você foi convidado para jogar cooperativo online. Toque no link e entre na partida.">
    <meta property="og:image" content="https://retro-nfc.pages.dev/og-convite.png">
    <meta property="og:image:width" content="2048">
    <meta property="og:image:height" content="1152">
    <meta property="og:url" content="https://retro-nfc.pages.dev/convite.html">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Retrô NFC — Jogue comigo!">
    <meta name="twitter:description" content="Você foi convidado para jogar cooperativo online.">
    <meta name="twitter:image" content="https://retro-nfc.pages.dev/og-convite.png">

    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0B0714;
            --texto: #ece8f7;
            --dim: #b4abd0;
            --azul: #00CFFF;
            --roxo: #A020F0;
            --laranja: #FF8C00;
            --amarelo: #FFD700;
            --marca: linear-gradient(90deg, #00CFFF, #A020F0, #FF8C00, #FFD700);
            --cinza: rgba(128,128,128,.55);
            --cinza-borda: rgba(255,255,255,.28);
            --d: 156px;   /* tamanho da cruz */
            --f: 60px;    /* diametro dos botoes de face */
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--texto);
            font-family: 'VT323', monospace;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- Tela de espera ---------- */
        #gate {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(900px 500px at 50% -10%, rgba(160,32,240,.22), transparent 70%),
                var(--bg);
        }

        #gate.oculto { display: none; }

        .caixa {
            width: 100%;
            max-width: 400px;
            text-align: center;
            padding: 30px 24px;
            border: 2px solid transparent;
            border-radius: 16px;
            background:
                linear-gradient(160deg, #1a1230, #0F0A1C) padding-box,
                var(--marca) border-box;
            box-shadow: 0 0 34px rgba(160,32,240,.45);
        }

        .titulo {
            font-family: 'VT323', monospace;
            font-size: 44px;
            letter-spacing: 3px;
            line-height: 1.1;
            margin: 0 0 16px;
            background: linear-gradient(90deg, var(--laranja), var(--amarelo));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .texto {
            font-size: 24px;
            line-height: 1.35;
            color: var(--texto);
            margin: 0 0 16px;
        }

        .status {
            font-size: 24px;
            line-height: 1.3;
            color: var(--amarelo);
            min-height: 32px;
            margin: 0;
        }

        .cta {
            width: 100%;
            margin-top: 18px;
            background: linear-gradient(135deg, var(--laranja), var(--amarelo));
            color: #1a1230;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-size: 26px;
            letter-spacing: 1px;
            padding: 12px 16px;
            cursor: pointer;
            box-shadow: 0 0 18px rgba(255,140,0,.45);
            transition: transform .12s;
        }

        .cta:active { transform: scale(.97); }

        .dica {
            font-size: 20px;
            line-height: 1.3;
            color: var(--dim);
            margin: 14px 0 0;
        }

        /* ---------- Botões de topo ---------- */
        #fs, #padToggle {
            position: fixed;
            top: calc(10px + env(safe-area-inset-top));
            z-index: 60;
            width: 48px;
            height: 48px;
            padding: 0;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.22);
            background: rgba(11,7,20,.72);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            touch-action: manipulation;
        }

        #fs { right: 10px; }
        #padToggle { right: 66px; }

        #fs:active, #padToggle:active { transform: scale(.94); }

        #padToggle.desligado { color: var(--dim); border-color: rgba(255,255,255,.12); }

        /* ---------- Palco ---------- */
        #stage {
            position: fixed;
            inset: 0;
            display: none;
            background: #000;
        }

        #stage.ativo { display: block; }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        /* ---------- Controles (layout igual ao EmulatorJS) ---------- */
        #pad {
            position: fixed;
            inset: 0;
            z-index: 30;
            display: none;
            pointer-events: none;
            touch-action: none;
        }

        #pad.ativo { display: block; }

        body.sem-pad #pad { display: none !important; }

        .botao {
            padding: 0;
            border: 1px solid var(--cinza-borda);
            background: var(--cinza);
            color: rgba(255,255,255,.88);
            font-family: inherit;
            font-size: 34px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
        }

        .botao.pressionado {
            background: rgba(255,255,255,.55);
            color: #000;
        }

        /* Cruz: uma peça só em formato de "+" */
        .cruz {
            position: absolute;
            width: var(--d);
            height: var(--d);
            left: calc(14px + env(safe-area-inset-left));
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .cruz .botao {
            position: absolute;
            width: calc(var(--d) / 3);
            height: calc(var(--d) / 3);
            font-size: 22px;
            border-radius: 8px;
            color: rgba(0,0,0,.55);
        }

        .cruz::before, .cruz::after {
            content: '';
            position: absolute;
            background: var(--cinza);
            border-radius: 8px;
            pointer-events: none;
        }

        .cruz::before { left: calc(var(--d) / 3); top: 0; width: calc(var(--d) / 3); height: var(--d); }
        .cruz::after  { left: 0; top: calc(var(--d) / 3); width: var(--d); height: calc(var(--d) / 3); }

        .cruz .botao { background: transparent; border-color: transparent; z-index: 2; }
        .cruz .botao.pressionado { background: rgba(255,255,255,.5); }

        .cruz [data-idx="4"] { left: calc(var(--d) / 3); top: 0; }
        .cruz [data-idx="6"] { left: 0; top: calc(var(--d) / 3); }
        .cruz [data-idx="7"] { left: calc(var(--d) * 2 / 3); top: calc(var(--d) / 3); }
        .cruz [data-idx="5"] { left: calc(var(--d) / 3); top: calc(var(--d) * 2 / 3); }

        /* Faces em losango: X cima, Y esquerda, A direita, B baixo */
        .faces {
            position: absolute;
            width: calc(var(--f) * 2.5);
            height: calc(var(--f) * 2.5);
            right: calc(14px + env(safe-area-inset-right));
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .faces .botao {
            position: absolute;
            width: var(--f);
            height: var(--f);
            border-radius: 50%;
        }

        .faces [data-idx="9"] { left: calc(var(--f) * 0.75); top: 0; }
        .faces [data-idx="1"] { left: 0; top: calc(var(--f) * 0.75); }
        .faces [data-idx="8"] { right: 0; top: calc(var(--f) * 0.75); }
        .faces [data-idx="0"] { left: calc(var(--f) * 0.75); bottom: 0; }

        /* Select e Start lado a lado, embaixo no centro */
        .centro {
            position: absolute;
            left: 50%;
            bottom: calc(14px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            pointer-events: none;
        }

        .centro .botao {
            width: 96px;
            height: 42px;
            border-radius: 10px;
            font-size: 24px;
        }

        /* ---------- Celular em pé: controles descem ---------- */
        @media (orientation: portrait) {
            .cruz, .faces { top: auto; bottom: calc(90px + env(safe-area-inset-bottom)); transform: none; }
        }

        /* ---------- Celular deitado e baixo ---------- */
        @media (orientation: landscape) and (max-height: 520px) {
            :root { --d: 138px; --f: 54px; }

            #fs, #padToggle { width: 42px; height: 42px; }
            #fs { right: 8px; }
            #padToggle { right: 58px; }

            .centro .botao { width: 88px; height: 38px; font-size: 22px; }

            .caixa { padding: 18px 18px; max-width: 460px; }
            .titulo { font-size: 36px; margin-bottom: 8px; }
            .texto { font-size: 22px; margin-bottom: 8px; }
            .status { font-size: 22px; }
            .cta { margin-top: 10px; font-size: 24px; padding: 8px 16px; }
            .dica { font-size: 18px; margin-top: 8px; }
        }
    </style>
</head>
<body>

<button id="fs" type="button" data-fs aria-label="Tela cheia" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path id="fsIcone" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"
              fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</button>

<button id="padToggle" type="button" aria-label="Mostrar ou esconder os botões" aria-pressed="true">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
</button>

<div id="gate">
    <div class="caixa">
        <p class="titulo">RETRÔ NFC</p>
        <p class="texto">Você foi convidado para jogar! Aguarde a conexão com o anfitrião.</p>
        <p class="status" id="status">CONECTANDO...</p>
        <button class="cta" id="btnFsGate" type="button" data-fs>ENTRAR EM TELA CHEIA</button>
        <p class="dica">Fique nesta tela até o jogo começar. O sincronismo depende disso.</p>
    </div>
</div>

<div id="stage">
    <video id="video" autoplay playsinline muted></video>
</div>

<div id="pad">
    <div class="cruz">
        <button class="botao" data-idx="4" type="button" aria-label="Cima">▲</button>
        <button class="botao" data-idx="6" type="button" aria-label="Esquerda">◀</button>
        <button class="botao" data-idx="7" type="button" aria-label="Direita">▶</button>
        <button class="botao" data-idx="5" type="button" aria-label="Baixo">▼</button>
    </div>

    <div class="centro">
        <button class="botao" data-idx="2" type="button">Select</button>
        <button class="botao" data-idx="3" type="button">Start</button>
    </div>

    <div class="faces">
        <button class="botao" data-idx="9" type="button">X</button>
        <button class="botao" data-idx="1" type="button">Y</button>
        <button class="botao" data-idx="8" type="button">A</button>
        <button class="botao" data-idx="0" type="button">B</button>
    </div>
</div>

<script>
(function () {
    'use strict';

    const CFG       = window.RETRONFC_NETPLAY || {};
    const WS_BASE   = CFG.ws        || 'wss://retronfc-netplay.omitodofifa.workers.dev/ws';
    const VALIDADOR = CFG.validador || 'https://script.google.com/macros/s/AKfycbw2aJCwpgq1OJ1fVSXUz8hUMCK7M2Ho1l7HdUKGf8hF4rbS2FFEDGiyBW6FA03yRTz_/exec';

    const CHAVE_PAD = 'retronfc_pad_convidado';

    const params = new URLSearchParams(location.search);
    const sala   = (params.get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);

    const gate    = document.getElementById('gate');
    const status  = document.getElementById('status');
    const stage   = document.getElementById('stage');
    const video   = document.getElementById('video');
    const pad     = document.getElementById('pad');
    const btnFs   = document.getElementById('fs');
    const btnPad  = document.getElementById('padToggle');
    const iconeFs = document.getElementById('fsIcone');

    let ws = null;
    let pc = null;
    let canal = null;
    let pronto = false;
    let entrou = false;

    function dizer(t) { status.textContent = t; }

    /* ---------- Preferencia dos botoes na tela ---------- */
    function lerPad() {
        try { return localStorage.getItem(CHAVE_PAD) !== '0'; } catch (e) { return true; }
    }

    function salvarPad(v) {
        try { localStorage.setItem(CHAVE_PAD, v ? '1' : '0'); } catch (e) {}
    }

    function aplicarPad(visivel) {
        document.body.classList.toggle('sem-pad', !visivel);
        btnPad.classList.toggle('desligado', !visivel);
        btnPad.setAttribute('aria-pressed', visivel ? 'true' : 'false');
    }

    btnPad.addEventListener('click', function () {
        const visivel = document.body.classList.contains('sem-pad');
        aplicarPad(visivel);
        salvarPad(visivel);
    });

    aplicarPad(lerPad());

    /* ---------- Tela cheia ---------- */
    const ICONE_ENTRAR = 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5';
    const ICONE_SAIR   = 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5';

    function telaCheiaAtiva() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }

    function travarPaisagem() {
        try {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function () {});
            }
        } catch (e) {}
    }

    function pedirTelaCheia() {
        if (telaCheiaAtiva()) return;
        const el  = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;

        if (req) {
            try {
                const p = req.call(el);
                if (p && p.then) p.then(travarPaisagem).catch(function () {});
                else travarPaisagem();
                return;
            } catch (e) {}
        }

        // iOS Safari: nao existe requestFullscreen no documento, so no video
        if (video && video.webkitEnterFullscreen) {
            try { video.webkitEnterFullscreen(); } catch (e) {}
        }
    }

    function sairTelaCheia() {
        const sair = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (sair) { try { sair.call(document); } catch (e) {} }
    }

    function alternarTelaCheia() {
        if (telaCheiaAtiva()) sairTelaCheia();
        else pedirTelaCheia();
    }

    function atualizarIconeFs() {
        const ativo = telaCheiaAtiva();
        if (iconeFs) iconeFs.setAttribute('d', ativo ? ICONE_SAIR : ICONE_ENTRAR);
        btnFs.setAttribute('aria-pressed', ativo ? 'true' : 'false');
        btnFs.setAttribute('aria-label', ativo ? 'Sair da tela cheia' : 'Tela cheia');
    }

    document.addEventListener('fullscreenchange', atualizarIconeFs);
    document.addEventListener('webkitfullscreenchange', atualizarIconeFs);
    atualizarIconeFs();

    document.querySelectorAll('[data-fs]').forEach(function (b) {
        b.addEventListener('click', alternarTelaCheia);
    });

    // Primeiro gesto do usuario ja entra em tela cheia (o navegador exige gesto)
    function aoPrimeiroGesto(ev) {
        if (ev.target && ev.target.closest && ev.target.closest('[data-fs]')) return;
        document.removeEventListener('pointerdown', aoPrimeiroGesto, true);
        document.removeEventListener('keydown', aoPrimeiroGesto, true);
        pedirTelaCheia();
    }

    document.addEventListener('pointerdown', aoPrimeiroGesto, true);
    document.addEventListener('keydown', aoPrimeiroGesto, true);

    /* ---------- Tag ---------- */
    function extrairUid(url) {
        const m = String(url || '').match(/\/tag\/([A-Za-z0-9_-]{4,64})/);
        return m ? m[1] : '';
    }

    async function validar(uid) {
        dizer('VALIDANDO TAG...');
        try {
            const r = await fetch(VALIDADOR, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({
                    origemRequisicao: 'SiteRetroNFC',
                    tipo: 'ValidarTag',
                    tag: uid,
                    sala: sala
                })
            });
            const j = await r.json();
            if (!j || !j.ok || !j.token) {
                dizer('TAG NÃO RECONHECIDA.');
                return;
            }
            dizer('TAG OK. CONECTANDO...');
            conectar(j.token);
        } catch (e) {
            dizer('SEM CONEXÃO. TENTE DE NOVO.');
        }
    }

    async function lerTagNativa() {
        if (!('NDEFReader' in window)) return false;
        try {
            const ndef = new NDEFReader();
            await ndef.scan();
            ndef.onreading = function (ev) {
                for (const rec of ev.message.records) {
                    if (rec.recordType !== 'url' && rec.recordType !== 'absolute-url') continue;
                    const uid = extrairUid(new TextDecoder().decode(rec.data));
                    if (uid) { validar(uid); return; }
                }
            };
            return true;
        } catch (e) {
            return false;
        }
    }

    /* ---------- Controles ---------- */
    function enviar(obj) {
        if (canal && canal.readyState === 'open') canal.send(JSON.stringify(obj));
    }

    function ligarBotoes() {
        document.querySelectorAll('.botao[data-idx]').forEach(function (b) {
            const idx = parseInt(b.getAttribute('data-idx'), 10);
            let apertado = false;

            function apertar(ev) {
                ev.preventDefault();
                if (apertado) return;
                apertado = true;
                b.classList.add('pressionado');
                try { b.setPointerCapture(ev.pointerId); } catch (e) {}
                enviar({ b: [[idx, 1]] });
            }

            function soltar(ev) {
                ev.preventDefault();
                if (!apertado) return;
                apertado = false;
                b.classList.remove('pressionado');
                enviar({ b: [[idx, 0]] });
            }

            b.addEventListener('pointerdown', apertar);
            b.addEventListener('pointerup', soltar);
            b.addEventListener('pointercancel', soltar);
            b.addEventListener('lostpointercapture', soltar);
            b.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
        });
    }

    const TECLAS = {
        ArrowUp: 4, ArrowDown: 5, ArrowLeft: 6, ArrowRight: 7,
        KeyZ: 0, KeyX: 8, KeyA: 1, KeyS: 9, Enter: 3, ShiftRight: 2, ShiftLeft: 2
    };

    const pressionadas = {};

    function digitando(el) {
        if (!el) return false;
        const t = (el.tagName || '').toLowerCase();
        return t === 'input' || t === 'textarea' || t === 'select' || el.isContentEditable;
    }

    function ligarTeclado() {
        window.addEventListener('keydown', function (ev) {
            if (digitando(ev.target)) return;

            if (ev.code === 'KeyF' && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
                ev.preventDefault();
                if (!ev.repeat) alternarTelaCheia();
                return;
            }

            const idx = TECLAS[ev.code];
            if (idx === undefined) return;
            ev.preventDefault();
            if (ev.repeat || pressionadas[idx]) return;
            pressionadas[idx] = true;
            enviar({ b: [[idx, 1]] });
        });

        window.addEventListener('keyup', function (ev) {
            const idx = TECLAS[ev.code];
            if (idx === undefined) return;
            ev.preventDefault();
            if (!pressionadas[idx]) return;
            pressionadas[idx] = false;
            enviar({ b: [[idx, 0]] });
        });

        // Perder o foco com tecla apertada deixaria o botao travado no host
        window.addEventListener('blur', function () {
            Object.keys(pressionadas).forEach(function (k) {
                if (!pressionadas[k]) return;
                pressionadas[k] = false;
                enviar({ b: [[parseInt(k, 10), 0]] });
            });
        });
    }

    /* ---------- WebRTC ---------- */
    function montarPeer() {
        pc = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:stun.cloudflare.com:3478' },
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        });

        pc.ontrack = function (ev) {
            video.srcObject = ev.streams[0];
            video.play().catch(function () {});
        };

        pc.ondatachannel = function (ev) {
            canal = ev.channel;
            canal.onopen = function () { enviar({ b: [] }); };
        };

        pc.onicecandidate = function (ev) {
            if (ev.candidate) enviarSinal({ candidate: ev.candidate });
        };

        pc.onconnectionstatechange = function () {
            if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                dizer('CONEXÃO PERDIDA. PEÇA UM NOVO LINK.');
            }
        };

        return pc;
    }

    function enviarSinal(dados) {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'sinal', dados: dados }));
    }

    async function receberSinal(dados) {
        if (!dados || !pc) return;

        if (dados.offer) {
            if (pc.remoteDescription) {
                try { pc.close(); } catch (e) {}
                canal = null;
                montarPeer();
            }
            await pc.setRemoteDescription(dados.offer);
            const resposta = await pc.createAnswer();
            await pc.setLocalDescription(resposta);
            enviarSinal({ answer: pc.localDescription });
            return;
        }

        if (dados.candidate) {
            try { await pc.addIceCandidate(dados.candidate); } catch (e) {}
        }
    }

    function conectar(token) {
        if (pronto) return;
        pronto = true;

        ws = new WebSocket(WS_BASE + '?sala=' + sala);

        ws.onopen = function () {
            ws.send(JSON.stringify({ t: 'entrar', sala: sala, token: token, apelido: 'Convidado' }));
        };

        ws.onmessage = function (ev) {
            let d;
            try { d = JSON.parse(ev.data); } catch (e) { return; }

            if (d.t === 'entrou') {
                entrou = true;
                montarPeer();
                dizer('CONECTADO! AGUARDE O ANFITRIÃO ABRIR O JOGO...');
                return;
            }

            if (d.t === 'sinal') { receberSinal(d.dados).catch(function () {}); return; }

            if (d.t === 'erro') {
                const msgs = {
                    'link-expirado': 'ESTE LINK EXPIROU. PEÇA UM NOVO AO ANFITRIÃO.',
                    'sala-fechada': 'ESTA SALA NÃO EXISTE MAIS. PEÇA UM NOVO LINK.',
                    'sala-cheia': 'ESTA SALA JÁ TEM OUTRO JOGADOR.'
                };
                dizer(msgs[d.erro] || 'NÃO FOI POSSÍVEL ENTRAR.');
                return;
            }

            if (d.t === 'saiu') { dizer('O ANFITRIÃO SAIU.'); return; }
        };

        ws.onerror = function () { dizer('SEM CONEXÃO COM O SERVIDOR.'); };

        ws.onclose = function () {
            if (!entrou) dizer('CONEXÃO ENCERRADA. PEÇA UM NOVO LINK.');
        };

        video.addEventListener('playing', function () {
            gate.classList.add('oculto');
            stage.classList.add('ativo');
            pad.classList.add('ativo');
            pedirTelaCheia();
        });
    }

    function iniciar() {
        if (!sala) { dizer('CONVITE INVÁLIDO.'); return; }

        ligarBotoes();
        ligarTeclado();
        dizer('ENTRANDO NA SALA...');
        conectar('');
    }

    document.addEventListener('DOMContentLoaded', iniciar);
})();
</script>
</body>
</html>

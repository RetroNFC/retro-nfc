<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrô NFC</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        (function () {
            var host = window.location.hostname;
            var params = new URLSearchParams(window.location.search);
            var chave = params.get("k") || "";

            // Domínio antigo (GitHub Pages): encaminha para o novo domínio.
            if (host === "retronfc.github.io") {
                var url = "https://retro-nfc.pages.dev/play.html" + (chave ? "?k=" + encodeURIComponent(chave) : "");
                window.location.replace(url);
                return;
            }

            // Domínio novo: segue o fluxo normal.
            window.location.replace("play.html" + window.location.search);
        })();
    </script>
</head>
<body>
    <div id="splashScreen">
        <img src="assets/img/retronfc.webp" alt="Logo Retrô NFC">
    </div>

    <noscript>
        <p style="color:#fff;font-family:monospace;text-align:center;padding:20px;">
            Ative o JavaScript ou <a href="play.html" style="color:#E60012;">clique aqui</a>.
        </p>
    </noscript>
</body>
</html>

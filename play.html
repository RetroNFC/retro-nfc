<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrô NFC</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="splashScreen">
        <img src="assets/img/retronfc.png" alt="Logo Retrô NFC">
    </div>
    
    <section id="gameScreen" style="display: none;">
        <img id="gameCover" src="" alt="Capa do Jogo">
        <h1 id="title">Carregando...</h1>
        <h2 id="subtitle"></h2>
        
        <div class="info">
            <p id="year"></p>
            <p id="players"></p>
            <p id="developer"></p>
        </div>
        
        <button id="btnJogar">JOGAR</button>
    </section>

    <section id="bootScreen" style="display: none;">
        <div class="header">
            <div class="bootLogo">RETRÔ NFC</div>
            <div class="bootConsole">SUPER NINTENDO</div>
        </div>
        <div id="bootTerminal" class="bootTerminal"></div>
        <div id="progressText" class="progressText">□□□□□□□□□□</div>
    </section>

    <section id="emulatorScreen" style="display: none; width: 100vw; height: 100vh;">
        <div style="width:100%; height:100%; max-width:100%;">
            <div id="game"></div>
        </div>
    </section>
    
    <div id="invalidScreen"></div>

    <audio id="bootSound" src="assets/life.mp3"></audio>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/boot.js"></script>
    <script src="assets/js/analytics.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        if (window.location.search.includes("k=")) {
            setTimeout(function() {
                if (window.history.replaceState) {
                    const urlFalsa = window.location.protocol + "//" + window.location.host + window.location.pathname + "?k=sessao-nfc-ativa-nao-compartilhar";
                    window.history.replaceState({ path: urlFalsa }, '', urlFalsa);
                }
            }, 500); 
        }
    });
    </script>
</body>
</html>

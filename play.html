<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrô NFC</title>
    <meta name="theme-color" content="#0B0714">
    <!-- ===== Preview de link (Open Graph / Twitter) ===== -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Retrô NFC">
    <meta property="og:title" content="Retrô NFC — Encoste a tag e jogue">
    <meta property="og:description" content="Sua coleção Super Nintendo na palma da mão. Encoste a tag NFC e o cartucho abre no navegador.">
    <meta property="og:url" content="https://retro-nfc.pages.dev/play.html">
    <meta property="og:image" content="https://retro-nfc.pages.dev/assets/img/og-retronfc.jpg">
    <meta property="og:image:secure_url" content="https://retro-nfc.pages.dev/assets/img/og-retronfc.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Três cartuchos Super Nintendo com as capas de Super Mario World, Zelda e Donkey Kong Country sob neon retrô">
    <meta property="og:locale" content="pt_BR">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Retrô NFC — Encoste a tag e jogue">
    <meta name="twitter:description" content="Sua coleção Super Nintendo na palma da mão. Encoste a tag NFC e o cartucho abre no navegador.">
    <meta name="twitter:image" content="https://retro-nfc.pages.dev/assets/img/og-retronfc.jpg">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/conquistas.css">
    <script>
        (function () {
            var CHAVE_SESSAO = 'retronfc_chave_ativa';
            var CHAVE_FALSA  = 'sessao-nfc-ativa-nao-compartilhar';

            function lerSessao() {
                try { return sessionStorage.getItem(CHAVE_SESSAO) || ''; } catch (e) { return ''; }
            }

            function gravarSessao(chave) {
                try { sessionStorage.setItem(CHAVE_SESSAO, chave); } catch (e) {}
            }

            var params = new URLSearchParams(window.location.search);
            var chave = params.get('k') || '';

            // Dominio antigo (GitHub Pages): redireciona preservando a chave real.
            if (window.location.hostname === 'retronfc.github.io') {
                if (chave === CHAVE_FALSA) chave = lerSessao();

                window.location.replace(
                    'https://retro-nfc.pages.dev/play.html' +
                    (chave ? '?k=' + encodeURIComponent(chave) : '')
                );
                return;
            }

            // Guarda a chave real desta sessao. A URL mascarada NAO e restaurada:
            // quem recarrega depois da camuflagem cai na tela de bloqueio.
            if (chave && chave !== CHAVE_FALSA) gravarSessao(chave);
        })();
    </script>

    <style>
        /* =========================================
           AJUSTES EXCLUSIVOS DE DESKTOP
           O celular continua exatamente como está.
           ========================================= */
        @media (min-width: 769px) {

            /* Sem barras de rolagem: as telas ocupam a janela inteira */
            html, body {
                height: 100%;
                overflow: hidden;
            }

            body {
                padding: 0;
                min-height: 100dvh;
            }

            #gameScreen,
            #bootScreen {
                width: 100%;
            }

            /* SPLASH: mostra a arte inteira, sem esticar */
            #splashScreen {
                width: 100%;
            }

            #splashScreen img {
                object-fit: contain;
            }

            /* BOOT: fundo sem corte e tipografia proporcional à tela */
            #bootScreen::before {
                background-size: contain;
                background-position: center center;
            }

            .header { margin-bottom: 42px; }
            .bootLogo { font-size: 58px; letter-spacing: 3px; }
            .bootConsole { font-size: 24px; letter-spacing: 3px; }

            .bootTerminal { min-height: 170px; gap: 16px; }
            .bootLine { font-size: 15px; }

            .progress-container {
                width: 440px;
                height: 32px;
                margin-top: 22px;
                padding: 4px;
            }

            .progress-fill { background-size: 432px 100%; }

            /* TELA DO JOGO: capa e textos maiores */
            #gameScreen { padding: 32px; }
            #gameCover { max-width: 360px; margin-bottom: 26px; }
            #title { font-size: 24px; }
            #subtitle { font-size: 14px; }

            .info { max-width: 460px; gap: 10px; }
            .info p { font-size: 13px; padding: 8px 14px; }

            #btnJogar, #startButton {
                width: 320px;
                height: 145px;
                margin-top: 30px;
            }

            #btnEstante {
                font-size: 12px;
                padding: 16px 32px;
                margin-top: 20px;
            }

            /* TELA DE BLOQUEIO: arte inteira, sem esticar */
            #invalidScreen {
                background-size: contain !important;
                background-color: #000 !important;
            }

            #btnEstanteErro {
                font-size: 13px;
                padding: 18px 38px;
                bottom: 12%;
            }
        }

        /* Janelas de desktop com pouca altura: capa à esquerda, texto à direita */
        @media (min-width: 769px) and (max-height: 860px) {

            #gameScreen:not([style*="display: none"]) {
                display: grid !important;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-rows: repeat(5, auto);
                align-content: center;
                justify-items: center;
                column-gap: 48px;
                height: 100dvh;
                padding: 24px 48px;
            }

            #gameCover {
                grid-column: 1;
                grid-row: 1 / span 5;
                align-self: center;
                justify-self: end;
                width: auto;
                height: auto;
                max-width: 100%;
                max-height: 74dvh;
                object-fit: contain;
                margin: 0;
            }

            #title, #subtitle, .info, #btnJogar, #btnEstante {
                grid-column: 2;
            }

            #btnJogar, #startButton {
                margin-top: 14px;
            }

            #btnEstante {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="splashScreen">
        <img src="assets/img/retronfc.webp" alt="Logo Retrô NFC">
    </div>

    <section id="gameScreen" style="display: none;">
        <img id="gameCover" src="" alt="Capa do Jogo">
        <h1 id="title">Carregando...</h1>
        <h2 id="subtitle"></h2>

        <div class="info">
            <p id="year"></p>
            <p id="players"></p>
            <p id="developer"></p>
        </div>

        <button id="btnJogar">JOGAR</button>
        <!-- 🏆 BOTÃO DA ESTANTE -->
        <button id="btnEstante" onclick="rastrearCliqueColecao('Tela Principal')">VER MEUS CARTUCHOS</button>
    </section>

    <section id="bootScreen" style="display: none;">
        <div class="header">
            <div class="bootLogo">RETRO NFC</div>
            <div class="bootConsole">SUPER NINTENDO</div>
        </div>
        <div id="bootTerminal" class="bootTerminal"></div>
        <div id="progressContainer" class="progress-container">
            <div id="progressFill" class="progress-fill"></div>
        </div>
    </section>

    <section id="emulatorScreen" style="display: none; width: 100vw; height: 100vh;">
        <div style="width:100%; height:100%; max-width:100%;">
            <div id="game"></div>
        </div>
    </section>

    <div id="invalidScreen">
        <!-- BOTÃO DE VENDAS NA TELA DE ERRO -->
        <button id="btnEstanteErro" onclick="rastrearCliqueColecao('Tela de Bloqueio - Link Compartilhado')">VER MEUS CARTUCHOS</button>
    </div>

    <audio id="bootSound" src="assets/life.mp3"></audio>
    <script src="assets/js/conquistas.js"></script>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/boot.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        if (window.location.search.includes("k=")) {
            setTimeout(function() {
                if (window.history.replaceState) {
                    const urlFalsa = window.location.protocol + "//" + window.location.host + window.location.pathname + "?k=sessao-nfc-ativa-nao-compartilhar";
                    window.history.replaceState({ path: urlFalsa }, '', urlFalsa);
                }
            }, 500); 
        }
    });
    </script>
</body>
</html>
